name: Platform verification

on:
  push:
    branches: [main, 'codex/pkg34-complete', 'codex/calm-finance-release']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: siftentry_app/requirements-api.txt
      - run: pip install -r siftentry_app/requirements-api.txt pytest requests pdfplumber
      - name: Test database and connector safety
        env:
          SIFTENTRY_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://postgres:test-only-password@localhost:5432/postgres' || '' }}
        run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r ../../siftentry_app/requirements-api.txt
      - run: pnpm exec playwright install --with-deps chromium
      - name: Start isolated QA services
        run: |
          EZ_API_DATABASE_URL=sqlite:////tmp/siftentry-ui-tests.db EZ_API_UPLOAD_DIRECTORY=/tmp/siftentry-ui-uploads EZ_API_EMAIL_PROVIDER=memory python -m uvicorn siftentry_app.backend.main:app --app-dir ../.. --host 127.0.0.1 --port 8000 > /tmp/siftentry-qa-api.log 2>&1 &
          pnpm start > /tmp/siftentry-qa-web.log 2>&1 &
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8000/health
          curl --retry 30 --retry-connrefused --retry-delay 1 --fail http://localhost:3000/login -o /dev/null
      - name: Light, dark, mobile and reporting regressions
        run: pnpm e2e e2e/reporting-design.spec.ts --workers=1 --max-failures=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-qa-results
          path: apps/web/test-results/
          retention-days: 14
