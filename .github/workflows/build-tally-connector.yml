name: Build Tally connector installer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build requirements
        run: python -m pip install --upgrade -r packaging/windows/tally-connector/requirements.txt

      - name: Build app with PyInstaller
        run: >
          python -m PyInstaller --noconfirm --clean
          --distpath packaging/windows/tally-connector/dist
          --workpath packaging/windows/tally-connector/build
          packaging/windows/tally-connector/SiftEntryTallyConnector.spec

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer with Inno Setup
        working-directory: packaging/windows/tally-connector
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc SiftEntryTallyConnector.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: List installer output
        run: Get-ChildItem packaging/windows/tally-connector/output

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiftEntry-Tally-Connector-Setup
          path: packaging/windows/tally-connector/output/SiftEntry-Tally-Connector-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
