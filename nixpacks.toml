[phases.setup]
nixPkgs = ["python312"]

[phases.install]
cmds = [
  "python -m venv /opt/venv",
  "/opt/venv/bin/pip install --upgrade pip",
  "/opt/venv/bin/pip install -r siftentry_app/requirements-api.txt"
]

[start]
cmd = "/opt/venv/bin/python -m uvicorn siftentry_app.backend.main:app --host 0.0.0.0 --port ${PORT:-8000}"
