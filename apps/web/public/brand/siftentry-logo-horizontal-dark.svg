<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">SiftEntry horizontal logo — dark</title>
  <desc id="desc">Transparent dark-mode SiftEntry horizontal logo with aligned cyan-line mark.</desc>
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="entryText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B8CFF"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <style>
      .word { font: 800 78px Inter, Manrope, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: -0.06em; }
    </style>
  </defs>
  <g transform="translate(40 46)">
    <rect width="128" height="128" rx="38" fill="url(#iconBg)"/>
    <path d="M48.5 42 L71 64 L48.5 86" fill="none" stroke="#FFFFFF" stroke-width="11.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 91.5 H83" fill="none" stroke="#67E8F9" stroke-width="8.5" stroke-linecap="round"/>
  </g>
  <text class="word" x="208" y="138">
    <tspan fill="#FFFFFF">Sift</tspan><tspan fill="url(#entryText)">Entry</tspan>
  </text>
</svg>
